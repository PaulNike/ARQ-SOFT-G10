spring:
  application:
    name: inventario-service
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 1000
        max-interval: 3000
        multiplier: 1.2
  config:
    import: "configserver:http://localhost:8888"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Todos los procesos de esta demo corren en la misma computadora del alumno.
    hostname: localhost
    # Intervalos reducidos para observar registro y baja durante una clase.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
