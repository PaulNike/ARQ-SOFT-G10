server:
  port: 8082
spring:
  application:
    name: pedidos-service
  datasource:
    url: jdbc:h2:mem:pedidosdb
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: mercadotech
    password: mercadotech

mercadotech:
  catalogo-service:
    url: http://localhost:8081
    timeout-ms: 2000
  pagos-service:
    url: http://localhost:8084
    timeout-ms: 2000
  envios-service:
    url: http://localhost:8085
    timeout-ms: 2000
resilience4j:
  circuitbreaker:
    instances:
      catalogo:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 1
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{traceId:-sin-trace}] %-5level %logger{36} - %msg%n"
  level:
    root: debug
