server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalogo-service
          uri: http://localhost:8081
          predicates:
            - Path=/catalogo-service/**
          filters:
            - StripPrefix=1
        - id: pedidos-service
          uri: http://localhost:8082
          predicates:
            - Path=/pedidos-service/**
          filters:
            - StripPrefix=1
        - id: pagos-service
          uri: http://localhost:8084
          predicates:
            - Path=/pagos-service/**
          filters:
            - StripPrefix=1
        - id: envios-service
          uri: http://localhost:8085
          predicates:
            - Path=/envios-service/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
